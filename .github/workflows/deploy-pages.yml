name: Deploy to GitHub Pages

# Deploys the static app (repo root) to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment →
# Source = "GitHub Actions".
on:
  push:
    branches:
      - main
      - claude/recording-ai-app-izqo84
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The app is a static site served from the repository root.
          # Server-side code (supabase/) is not part of the published site.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
